# Sala Operativa — simulazione geopolitica in pixel-art (1990–2026).
# Sito statico (Vite) in /var/www/html/sala-operativa, servito sotto /sala-operativa/.
# Installazione: conf-available/sala-operativa.conf + a2enconf (vedi installa-balthasar.sh).
# Su Balthasar AllowOverride e' None: le regole stanno qui.
# Il gioco e' privato: si entra con la stessa password dell'accesso admin della landing page
# (/etc/balthasar/landing.htpasswd, bcrypt; si cambia con htpasswd -B).

<Directory /var/www/html/sala-operativa>
    Options -Indexes
    AuthType Basic
    AuthName "Sala Operativa - accesso riservato"
    AuthBasicProvider file
    AuthUserFile /etc/balthasar/landing.htpasswd
    Require valid-user
    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow"
        # La pagina e la versione si ricontrollano sempre; gli asset hanno l'impronta nel nome.
        <FilesMatch "^(index\.html|version\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
    <IfModule mod_deflate.c>
        # scenari (JSON, 20 MB in tutto) e carte (.bin) si comprimono molto
        AddOutputFilterByType DEFLATE application/json application/octet-stream
    </IfModule>
</Directory>

<Directory /var/www/html/sala-operativa/assets>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

# Carte, scenari, ritratti, suoni e musiche cambiano solo con una nuova versione
<DirectoryMatch "^/var/www/html/sala-operativa/(mappa|scenarios|consiglieri|suoni|musica)">
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=86400"
    </IfModule>
</DirectoryMatch>

# /sala-operativa (senza barra) → /sala-operativa/
RedirectMatch 301 ^/sala-operativa$ /sala-operativa/
